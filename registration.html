<!DOCTYPE html>
<html lang="RU-ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Registration</title>
</head>
<body>
    <main class="regismain">
        <header>
            <h1>Student Registration</h1>
            <h2>Create your student account</h2>
        </header>
        <section class="login">
            <form action="/api/login" method="get">
                <fieldset>
                    <label for="text">Full Name</label>
                    <input type="text" placeholder="Enter Your Full Name">
                </fieldset>
                <fieldset>
                    <label for="email">Email Adress</label>
                    <input type="email" placeholder="Enter Your Email">
                </fieldset>
                <fieldset>
                    <label for="ID">Student ID</label>
                    <input type="ID" placeholder="Enter Your Student ID">
                </fieldset>
                <fieldset>
                    <label>Choose Your Program</label>
                    <select>
                        <option value="">— Choose Your Program —</option>
                        <option value="Phisycs">Phisycs</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="HealthCare">HealthCare</option>
                    </select>
                </fieldset>
                <fieldset>
                    <label for="password">Password</label>
                    <input type="password" placeholder="Enter Your Password">
                </fieldset>
                <fieldset>
                    <label for="password">Confirm Password</label>
                    <input type="password" placeholder="Confirm Your Password">
                </fieldset>
                <fieldset id="RemMe">
                    <input type="checkbox">
                    <label for="checkbox">I Agree To The Terms Of Service and Privaty Policy</label>
                </fieldset>
                <button type="submit">Create Account</button>
            </form>
        </section>
        <section id="regis">
            <div class="registration">
                <a>Already have account?</a>
                <a href="login.html">Log In</a>
            </div>
        </section>
    </main>
</body>
</html>
